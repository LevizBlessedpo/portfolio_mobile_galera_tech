<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree | Levi Santos</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="perfil">
      <img src="img/minha_foto.jpg" alt="Minha foto" class="foto" />
      <h2>@levi.santos_dc</h2>
      <button class="temaPagina" aria-label="Alternar tema">
        <i class="bi bi-moon-stars-fill"></i>
      </button>

      <div class="links">
        <a href="https://www.instagram.com/levi.santos_dc" target="_blank">
          Meu Instagram
        </a>
        <a href="https://galeratech.com.br/" target="_blank">
          Conheça o Galera Tech
        </a>
        <a href="https://portifolio-nextjs-puce.vercel.app/" target="_blank">
          Veja meu portfólio!
        </a>
        <a href="https://github.com/LevizBlessedpo" target="_blank">
          Analise meu perfil!
        </a>
      </div>

      <div class="social_links">
        <a href="https://github.com/LevizBlessedpo" target="_blank" aria-label="GitHub">
          <i class="bi bi-github"></i>
        </a>
        <a href="https://www.instagram.com/levi.santos_dc" target="_blank" aria-label="Instagram">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="https://www.linkedin.com/in/levi-santos-da-cruz-9a998533a/" target="_blank" aria-label="LinkedIn">
          <i class="bi bi-linkedin"></i>
        </a>
      </div>

      <div class="footer">Feito com &hearts; | Levi Santos da Cruz 2026</div>
    </div>

    <!-- Importação do JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
